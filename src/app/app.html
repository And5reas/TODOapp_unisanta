<main class="main">
  <div class="content">
    <h1>Mozilla Dev - My To Do List</h1>

    <input class="lg-text-input" #campoNovoItem (keyup.enter)="CREATE_tarefa(campoNovoItem)" />
    <button class="btn-primary" (click)="CREATE_tarefa(campoNovoItem)">
      Adicionar Tarefa
    </button>

    <ul>
      <li *ngFor="let tarefaDoLoop of arrayDeTarefas">
        <app-tarefa-item 
           [tarefa]="tarefaDoLoop" 
           (removerTarefa)="DELETE_tarefa($event)">
        </app-tarefa-item>
      </li>
    </ul>
  </div>
</main>
