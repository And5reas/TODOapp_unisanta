# ============================================================
# Docker Compose - TODOapp (Frontend Angular + Backend Express)
# Uso: cp .env.example .env && docker compose up -d --build
# ============================================================
name: todoapp

services:
  # ---------- Backend: Node.js + Express + Mongoose ----------
  backend:
    build:
      context: ./backend
    image: ${DOCKERHUB_USER:-and5reas}/${PROJECT_NAME:-todoapp}-backend:latest
    container_name: todoapp-backend
    restart: unless-stopped
    ports:
      # Porta exposta ao host (ajustável via .env) -> 3000 no container
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
      # Aponta para o serviço mongodb abaixo (ou para um MongoDB externo/Atlas)
      MONGO_URL: ${MONGO_URL:-mongodb://mongodb:27017/todoapp}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - todoapp

  # ---------- Frontend: Angular (build) servido pelo Nginx ----------
  frontend:
    build:
      context: ./frontend
    image: ${DOCKERHUB_USER:-and5reas}/${PROJECT_NAME:-todoapp}-frontend:latest
    container_name: todoapp-frontend
    restart: unless-stopped
    ports:
      # Porta exposta ao host (ajustável via .env) -> 8080 no container
      - "${FRONTEND_PORT:-80}:8080"
    environment:
      # Proxy reverso do Nginx: /api/* -> backend (rede interna do Docker)
      BACKEND_UPSTREAM: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - todoapp

  # ---------- Banco de dados (dependência externa do Backend) ----------
  # Sem porta exposta ao host: acessível apenas pela rede interna do Docker.
  mongodb:
    image: mongo:8
    container_name: todoapp-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - todoapp

networks:
  todoapp:
    name: todoapp-net
    driver: bridge

volumes:
  mongo_data:
    name: todoapp-mongo-data
